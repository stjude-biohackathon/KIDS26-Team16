# Tool configuration only. Nothing here is installed: the scripts run directly
# (see README.md), so this file just tells pytest and ruff where the code is.

[tool.pytest.ini_options]
# Import roots: `scripts/` for scogs / experiments / audit, and the repository
# root for `dashboard`. Configured here - not with sys.path hacks in tests - so
# bare `pytest` and `python -m pytest` behave the same.
pythonpath = [".", "scripts"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["data", "results"]

[tool.ruff.lint]
# F: real bugs (unused / undefined names). E4: import placement.
# E7: one statement per line, lambda assignment. E9: syntax errors.
select = ["F", "E4", "E7", "E9"]

[tool.ruff.lint.per-file-ignores]
# Notebooks put scripts/ on sys.path before importing from it.
"notebooks/*.ipynb" = ["E402"]
# The rule engine and its tests keep their dense one-line guards; they are not
# being rewritten, and churn there is risk without benefit.
"scripts/scogs/*.py" = ["E701", "E702"]
"tests/*.py" = ["E701", "E702", "E731"]
# TEMPORARY - each entry is deleted by the task that rewrites the file (tasks/plan.md).
"scripts/experiments/medgemma_extraction.py" = ["E701", "E702"]      # Task 6
"scripts/audit/*.py" = ["E401", "E701", "E702", "F401"]              # Task 9
